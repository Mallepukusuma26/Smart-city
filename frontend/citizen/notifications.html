<!DOCTYPE html>
<html lang="en" class="citizen-portal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City - Notifications</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/citizen.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo" style="background: linear-gradient(135deg, #10B981, #06B6D4);"><i class="fa-solid fa-tree-city"></i></div>
        <div class="brand-title">Smart City<br><span style="font-size: 0.75rem; color: #10B981;">Citizen Portal</span></div>
      </div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="/citizen/dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li class="nav-item"><a href="/citizen/complaints.html"><i class="fa-solid fa-clipboard-list"></i> My Complaints</a></li>
        <li class="nav-item"><a href="/citizen/services.html"><i class="fa-solid fa-city"></i> City Services</a></li>
        <li class="nav-item active"><a href="/citizen/notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a></li>
        <li class="nav-item"><a href="/citizen/alerts.html"><i class="fa-solid fa-triangle-exclamation"></i> City Alerts</a></li>
        <li class="nav-item" style="margin-top: auto;"><a href="#" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <div style="font-weight: 700; font-size: 1.2rem;">Citizen Notifications & Broadcast Announcements</div>
      </header>

      <div class="page-body">
        <div class="data-table-container">
          <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-card); font-weight: 700;">
            <i class="fa-solid fa-bell" style="color: #F59E0B;"></i> Recent User Notifications
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Received Time</th>
                <th>Type</th>
                <th>Notification Title</th>
                <th>Message Content</th>
              </tr>
            </thead>
            <tbody id="notificationsTbody">
              <tr><td colspan="4" style="text-align: center;">Loading notifications...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await API.get('/citizen/notifications');
      const tbody = document.getElementById('notificationsTbody');
      if (res.notifications && res.notifications.length > 0) {
        tbody.innerHTML = res.notifications.map(n => `
          <tr>
            <td>${n.received_at ? n.received_at.split('T')[0] : 'Today'}</td>
            <td><span class="badge badge-info">${n.notification_type}</span></td>
            <td><strong>${n.title}</strong></td>
            <td>${n.message}</td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--color-slate-400);">No notifications received.</td></tr>';
      }
    });
  </script>
</body>
</html>
