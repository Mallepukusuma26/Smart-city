<!DOCTYPE html>
<html lang="en" class="officer-portal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City - Officer Assigned Tasks</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/officer.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo" style="background: linear-gradient(135deg, #F59E0B, #6366F1);"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="brand-title">Smart City<br><span style="font-size: 0.75rem; color: #F59E0B;">Officer Portal</span></div>
      </div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="/officer/dashboard.html"><i class="fa-solid fa-house"></i> Command Center</a></li>
        <li class="nav-item active"><a href="/officer/tasks.html"><i class="fa-solid fa-tasks"></i> Assigned Tasks</a></li>
        <li class="nav-item"><a href="/officer/incidents.html"><i class="fa-solid fa-triangle-exclamation"></i> Department Incidents</a></li>
        <li class="nav-item"><a href="/officer/analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
        <li class="nav-item"><a href="/officer/reports.html"><i class="fa-solid fa-file-export"></i> Export Reports</a></li>
        <li class="nav-item" style="margin-top: auto;"><a href="#" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-navbar">
        <div style="font-weight: 700; font-size: 1.2rem;">Officer Assigned Tasks & Complaint Inbox</div>
      </header>

      <div class="page-body">
        <div class="data-table-container">
          <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-card); font-weight: 700;">
            Department Task Queue & Escalations
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Ticket #</th>
                <th>Title</th>
                <th>Priority</th>
                <th>Citizen Name</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="allTasksTbody">
              <tr><td colspan="6" style="text-align: center;">Loading tasks...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/officer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await API.get('/officer/complaints');
      const tbody = document.getElementById('allTasksTbody');
      if (res.complaints) {
        tbody.innerHTML = res.complaints.map(c => `
          <tr>
            <td><strong>${c.ticket_number}</strong></td>
            <td>${c.title}</td>
            <td><span class="badge ${c.priority === 'CRITICAL' ? 'badge-danger' : 'badge-warning'}">${c.priority}</span></td>
            <td>${c.citizen_name}</td>
            <td><span class="badge badge-info">${c.status}</span></td>
            <td>
              <button onclick="updateStatusModal(${c.id}, 'RESOLVED')" class="btn btn-success" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Mark Resolved</button>
            </td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
