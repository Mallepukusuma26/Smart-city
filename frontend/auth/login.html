<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City Platform - Authentication Login</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand i {
      font-size: 2.5rem;
      color: #38BDF8;
      margin-bottom: 0.5rem;
    }
    .demo-credentials {
      margin-top: 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      border-radius: var(--radius-md);
      padding: 1rem;
      font-size: 0.8rem;
      color: var(--color-slate-400);
    }
    .demo-credentials code {
      color: #38BDF8;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <i class="fa-solid fa-city"></i>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Smart City Operations</h2>
      <p style="font-size: 0.85rem; color: var(--color-slate-400);">AI Operations & Management Portal</p>
    </div>

    <div id="authAlert" class="badge badge-danger" style="display: none; width: 100%; padding: 0.75rem; margin-bottom: 1rem; text-align: center;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username or email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-slate-400);">
      Don't have a citizen account? <a href="/auth/register.html">Register Here</a>
    </div>

    <div class="demo-credentials">
      <strong style="color: #fff;">Demo Access Credentials:</strong><br>
      • Admin: <code>admin@smartcity.gov</code> / <code>AdminPass123!</code><br>
      • Traffic Officer: <code>officer.traffic@smartcity.gov</code> / <code>OfficerPass123!</code><br>
      • Citizen: <code>citizen1@example.com</code> / <code>CitizenPass123!</code>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
